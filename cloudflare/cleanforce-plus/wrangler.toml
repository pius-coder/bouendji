name = "cleanforce-plus"
main = "worker.js"
compatibility_date = "2026-10-30"

# Les anciennes pages statiques ne servent plus que de repli si l'API est
# injoignable. Les domaines personnalisés (www + un sous-domaine par marque)
# restent attachés au Worker lors d'un nouveau déploiement.
[assets]
directory = "./assets"
binding = "ASSETS"
# Le Worker doit d'abord s'exécuter pour rendre la page depuis l'API ; sinon
# l'asset `/index.html` est servi avant lui et masque le rendu dynamique.
run_worker_first = true


# Domaines personnalisés : un sous-domaine par marque + www. Chaque déploiement
# les réattache ; sans cette liste, wrangler les retire du Worker.
[[routes]]
pattern = "bouendji.cleanforceplus.online"
custom_domain = true

[[routes]]
pattern = "teste.cleanforceplus.online"
custom_domain = true

[[routes]]
pattern = "goatvpn.cleanforceplus.online"
custom_domain = true

[[routes]]
pattern = "james-pro.cleanforceplus.online"
custom_domain = true

[[routes]]
pattern = "gregor44.cleanforceplus.online"
custom_domain = true

[[routes]]
