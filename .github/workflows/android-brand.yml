name: android-brand

# Un APK par marque, jamais un APK qui se thématise au lancement (D2).
# Le manifeste de marque est fourni en entrée ; le build réécrit BrandTokens.kt
# et brand.properties, puis compile. Rien n'est tiré au hasard.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Manifeste JSON de la marque (voir tools/brands/_example.json)"
        required: true
        type: string
      release_tag:
        description: "Étiquette de release à créer (facultatif)"
        required: false
        type: string
      build_callback_url:
        description: "URL appelée en fin de build (facultatif — n'existe que si la route est déployée)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-brand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Lire le manifeste
        id: spec
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          printf '%s' "$SPEC" > "$RUNNER_TEMP/brand.json"
          node -e '
            const s = require(process.env.RUNNER_TEMP + "/brand.json");
            console.log("pkg=" + s.packageName);
            console.log("name=" + s.appName);
          '
          # Le nom du fichier publié ne doit contenir que des caractères sûrs.
          PKG=$(node -p 'require(process.env.RUNNER_TEMP + "/brand.json").packageName')
          VN=$(node -p 'require(process.env.RUNNER_TEMP + "/brand.json").versionName')
          VC=$(node -p 'require(process.env.RUNNER_TEMP + "/brand.json").versionCode')
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "artifact=${PKG}-${VN}-${VC}.apk" >> "$GITHUB_OUTPUT"

      - name: Injecter la marque
        env:
          SPEC_PATH: ${{ runner.temp }}/brand.json
        run: node tools/inject-brand.mjs --spec "$SPEC_PATH" --root apps/android

      - name: Générer le wrapper Gradle
        working-directory: apps/android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Compiler
        working-directory: apps/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Signer
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARTIFACT: ${{ steps.spec.outputs.artifact }}
        run: |
          set -euo pipefail
          # `secrets` n'est pas disponible dans un `if` : on teste ici, et un
          # build sans keystore est signalé, pas silencieusement publié.
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 absent — APK produit mais NON signé."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APK=$(find apps/android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          fi
          [ -n "$APK" ] || { echo "aucun APK produit"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/$ARTIFACT" "$APK"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/$ARTIFACT" > "$RUNNER_TEMP/certs.txt"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Empreinte
        id: hash
        env:
          ARTIFACT: ${{ steps.spec.outputs.artifact }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/$ARTIFACT"
          if [ ! -f "$APK" ]; then APK=$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1); fi
          [ -f "$APK" ] || { echo "aucun APK à empreindre"; exit 1; }
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.spec.outputs.artifact }}
          path: ${{ steps.hash.outputs.apk }}
          retention-days: 30

      - name: Publier la release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          APK: ${{ steps.hash.outputs.apk }}
          SHA: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes "APK ${{ steps.spec.outputs.artifact }} — sha256 $SHA"

      - name: Signaler au backend
        if: ${{ inputs.build_callback_url != '' }}
        continue-on-error: true
        env:
          URL: ${{ inputs.build_callback_url }}
          TOKEN: ${{ secrets.BUILD_CALLBACK_TOKEN }}
          SHA: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$URL" \
            -H "authorization: Bearer $TOKEN" \
            -H "content-type: application/json" \
            --data "{\"status\":\"succeeded\",\"sha256\":\"$SHA\",\"runId\":\"${{ github.run_id }}\"}"
