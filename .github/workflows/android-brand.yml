name: android-brand

# Un APK par marque, jamais un APK qui se thématise au lancement (D2).
# Le manifeste de marque est fourni en entrée ; le build réécrit BrandTokens.kt
# et brand.properties, compile, signe, puis dépose l'APK dans Cloudflare R2
# (D100) : https://apps.numzer0.store/brands/<package>/… — c'est ce lien que
# l'admin remet à ses utilisateurs.
#
# Déclencheurs :
#   - workflow_dispatch uniquement : l'API le déclenche après validation de
#     l'owner (D117), ou un humain le lance à la main.
#
# Le déclencheur `push` a été retiré : il signait avec la clé de production
# depuis n'importe quelle branche, sur un dépôt public dont `master` n'est pas
# protégée. Un push pouvait donc produire un APK du même certificat pointant
# vers un autre serveur.
#
# Callbacks (D66) : `running` au démarrage, `succeeded` à la fin, `failed` si
# une étape échoue. L'API ignore les rapports qui arrivent après un état
# terminal (garde de transition côté routes/builds.ts).

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Manifeste JSON de la marque (voir tools/brands/_example.json)"
        required: true
        type: string
      build_callback_url:
        description: "URL appelée en fin de build (facultatif)"
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: android-brand-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  # L'archive et son empreinte sont publiées ensemble par le workflow `libbox`.
  LIBBOX_TAG: libbox-1.14.3
  R2_PUBLIC_BASE: https://apps.numzer0.store

jobs:
  specs:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Manifestes à construire
        id: list
        env:
          EVENT: ${{ github.event_name }}
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'list=["__input__"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Push : les manifestes modifiés par ce commit (hors exemple).
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'tools/brands/*.json' | grep -v '_example.json' || true)
          # Aucun manifeste modifié : aucun build. (Plus de repli sur bouendji.json,
          # qui publiait une APK de production à chaque push du workflow.)
          if [ -z "$CHANGED" ]; then
            echo "Aucun manifeste modifié : aucun build."
            echo "list=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIST=$(printf '%s\n' $CHANGED | node -e 'const l=require("fs").readFileSync(0,"utf8").trim().split("\n").filter(Boolean);console.log(JSON.stringify(l))')
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  build:
    needs: specs
    if: ${{ needs.specs.outputs.list != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.specs.outputs.list) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Lire le manifeste
        id: spec
        env:
          SPEC_INPUT: ${{ inputs.spec }}
          SPEC_FILE: ${{ matrix.spec }}
        run: |
          set -euo pipefail
          if [ "$SPEC_FILE" = "__input__" ]; then
            printf '%s' "$SPEC_INPUT" > "$RUNNER_TEMP/brand.json"
            # Un dispatch API ne transporte que le JSON, pas le chemin du
            # manifeste : on retrouve le dossier d'assets par `packageName`.
            DIR=$(node -e 'const fs=require("fs");const pkg=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/brand.json","utf8")).packageName;for(const f of fs.readdirSync("tools/brands")){if(!f.endsWith(".json")||f.startsWith("_"))continue;const p="tools/brands/"+f;try{if(JSON.parse(fs.readFileSync(p,"utf8")).packageName===pkg){console.log(p.replace(/\.json$/,""));break}}catch{}}')
            if [ -n "${DIR:-}" ] && [ -f "$DIR/icon.png" ]; then echo "assets=$DIR" >> "$GITHUB_OUTPUT"; else echo "assets=" >> "$GITHUB_OUTPUT"; fi
          else
            cp "$SPEC_FILE" "$RUNNER_TEMP/brand.json"
            # Icône et mascotte de la marque : tools/brands/<nom>/ s'il existe.
            DIR="${SPEC_FILE%.json}"
            if [ -f "$DIR/icon.png" ]; then echo "assets=$DIR" >> "$GITHUB_OUTPUT"; else echo "assets=" >> "$GITHUB_OUTPUT"; fi
          fi
          PKG=$(node -p 'require(process.env.RUNNER_TEMP + "/brand.json").packageName')
          VN=$(node -p 'require(process.env.RUNNER_TEMP + "/brand.json").versionName')
          VC=$(node -p 'require(process.env.RUNNER_TEMP + "/brand.json").versionCode')
          # Le nom du fichier publié ne doit contenir que des caractères sûrs.
          echo "$PKG$VN$VC" | grep -Eq '^[A-Za-z0-9._+-]+$' || { echo "package ou version non sûrs"; exit 1; }
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "artifact=${PKG}-${VN}-${VC}.apk" >> "$GITHUB_OUTPUT"

      - name: Signaler le démarrage au backend
        if: ${{ inputs.build_callback_url != '' }}
        # Informatif : une API injoignable au démarrage ne doit pas tuer le build.
        continue-on-error: true
        env:
          URL: ${{ inputs.build_callback_url }}
          TOKEN: ${{ secrets.BUILD_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(node -e 'console.log(JSON.stringify({status:"running",runId:process.env.GITHUB_RUN_ID}))')
          curl --fail --silent --show-error -X POST "$URL" \
            -H "authorization: Bearer $TOKEN" -H "content-type: application/json" --data "$BODY"

      - name: Injecter la marque
        env:
          SPEC_PATH: ${{ runner.temp }}/brand.json
        run: node tools/inject-brand.mjs --spec "$SPEC_PATH" --root apps/android

      - name: Icônes de la marque
        if: ${{ steps.spec.outputs.assets != '' }}
        env:
          ASSETS: ${{ steps.spec.outputs.assets }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          RES=apps/android/app/src/main/res
          ARGS="--src $ASSETS/icon.png --res $RES"
          if [ -f "$ASSETS/mascot.png" ]; then ARGS="$ARGS --mascot $ASSETS/mascot.png"; fi
          python3 tools/make-icons.py $ARGS
          # Aucune marque ne doit hériter de la mascotte d'une autre (le dépôt
          # contient celle de Bouendji par défaut). Sans mascotte fournie,
          # l'illustration est le logo de la marque.
          if [ -f "$ASSETS/mascot_alt.png" ]; then
            cp "$ASSETS/mascot_alt.png" "$RES/drawable-nodpi/brand_mascot_alt.png"
          elif [ -f "$ASSETS/mascot.png" ]; then
            cp "$ASSETS/mascot.png" "$RES/drawable-nodpi/brand_mascot_alt.png"
          else
            cp "$RES/drawable-nodpi/brand_icon.png" "$RES/drawable-nodpi/brand_mascot.png"
            cp "$RES/drawable-nodpi/brand_icon.png" "$RES/drawable-nodpi/brand_mascot_alt.png"
          fi

      # Sans icône fournie, la marque reçoit un logo dessiné pour elle (thème,
      # initiales, variation tirée du nom) au lieu de la mascotte du dépôt.
      # Pas de mascotte générée : celles qui n'en ont pas gardent leur logo.
      - name: Logo généré
        if: ${{ steps.spec.outputs.assets == '' }}
        env:
          SPEC_PATH: ${{ runner.temp }}/brand.json
        run: |
          set -euo pipefail
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core > /dev/null
          python3 -m pip install --quiet pillow
          OUT="$RUNNER_TEMP/logo"
          RES=apps/android/app/src/main/res
          node tools/make-logo.mjs --spec "$SPEC_PATH" --out "$OUT"
          rsvg-convert -w 512 -h 512 "$OUT/icon.svg" -o "$OUT/icon.png"
          python3 tools/make-icons.py --src "$OUT/icon.png" --res "$RES"
          cp "$RES/drawable-nodpi/brand_icon.png" "$RES/drawable-nodpi/brand_mascot.png"
          cp "$RES/drawable-nodpi/brand_icon.png" "$RES/drawable-nodpi/brand_mascot_alt.png"

      - name: Moteur libbox (Release GitHub, D102)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apps/android/app/libs
          for i in 1 2 3; do
            gh release download "$LIBBOX_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'libbox.aar*' --dir apps/android/app/libs --clobber && break
            [ "$i" = 3 ] && { echo "::error::libbox.aar introuvable dans la Release $LIBBOX_TAG (lancer le workflow libbox)"; exit 1; }
            sleep 5
          done
          echo "$(cat apps/android/app/libs/libbox.aar.sha256)  apps/android/app/libs/libbox.aar" | sha256sum -c -
          rm apps/android/app/libs/libbox.aar.sha256
          unzip -l apps/android/app/libs/libbox.aar | grep -q 'jni/arm64-v8a/libbox.so'
          unzip -l apps/android/app/libs/libbox.aar | grep -q 'jni/armeabi-v7a/libbox.so'
          ls -la apps/android/app/libs/libbox.aar

      - name: Générer le wrapper Gradle
        working-directory: apps/android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Compiler
        working-directory: apps/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Signer
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARTIFACT: ${{ steps.spec.outputs.artifact }}
        run: |
          set -euo pipefail
          # Un APK non signé ne s'installe pas : sans keystore, le build échoue.
          [ -n "${KEYSTORE_B64:-}" ] || { echo "::error::ANDROID_KEYSTORE_B64 absent"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APK=$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "aucun APK produit"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/$ARTIFACT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/$ARTIFACT" | grep -E "SHA-256|Signer" | head -3
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Empreinte
        id: hash
        env:
          ARTIFACT: ${{ steps.spec.outputs.artifact }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum "$RUNNER_TEMP/$ARTIFACT" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"

      # Copie de l'APK signé dans les artefacts du run : récupérable même si R2
      # n'est pas encore configuré (test sur appareil avant distribution).
      - name: Artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.spec.outputs.artifact }}
          path: ${{ runner.temp }}/${{ steps.spec.outputs.artifact }}
          retention-days: 14

      - name: Déposer dans R2
        id: r2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          PKG: ${{ steps.spec.outputs.pkg }}
          ARTIFACT: ${{ steps.spec.outputs.artifact }}
          SHA: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::secrets R2 absents (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY)"; exit 1; }
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          META="sha256=$SHA"
          # Version figée (jamais écrasée) + « latest » pour le lien à donner.
          aws s3 cp "$RUNNER_TEMP/$ARTIFACT" "s3://$R2_BUCKET/brands/$PKG/$ARTIFACT" \
            --endpoint-url "$ENDPOINT" --content-type application/vnd.android.package-archive --metadata "$META"
          aws s3 cp "$RUNNER_TEMP/$ARTIFACT" "s3://$R2_BUCKET/brands/$PKG/latest.apk" \
            --endpoint-url "$ENDPOINT" --content-type application/vnd.android.package-archive --metadata "$META" \
            --cache-control "no-cache"
          echo "url=$R2_PUBLIC_BASE/brands/$PKG/$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "latest=$R2_PUBLIC_BASE/brands/$PKG/latest.apk" >> "$GITHUB_OUTPUT"
          echo "### APK publié" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version : $R2_PUBLIC_BASE/brands/$PKG/$ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dernière : $R2_PUBLIC_BASE/brands/$PKG/latest.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256 : \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Signaler au backend
        if: ${{ inputs.build_callback_url != '' }}
        env:
          URL: ${{ inputs.build_callback_url }}
          TOKEN: ${{ secrets.BUILD_CALLBACK_TOKEN }}
          SHA: ${{ steps.hash.outputs.sha256 }}
          APK_URL: ${{ steps.r2.outputs.url }}
        run: |
          set -euo pipefail
          BODY=$(node -e 'console.log(JSON.stringify({status:"succeeded",sha256:process.env.SHA,apkUrl:process.env.APK_URL,runId:process.env.GITHUB_RUN_ID}))')
          curl --fail --silent --show-error -X POST "$URL" \
            -H "authorization: Bearer $TOKEN" -H "content-type: application/json" --data "$BODY"

      - name: Signaler l'échec au backend
        # Dernière étape : elle ne s'exécute que si une étape précédente a échoué.
        # Sans elle, le build reste `queued` ou `running` pour toujours.
        if: ${{ failure() && inputs.build_callback_url != '' }}
        env:
          URL: ${{ inputs.build_callback_url }}
          TOKEN: ${{ secrets.BUILD_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(node -e 'console.log(JSON.stringify({status:"failed",runId:process.env.GITHUB_RUN_ID}))')
          curl --fail --silent --show-error -X POST "$URL" \
            -H "authorization: Bearer $TOKEN" -H "content-type: application/json" --data "$BODY"
